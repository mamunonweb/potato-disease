services:
  potato-disease-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite inlines VITE_* variables at build time; compose substitutes
        # this from the project .env file (empty = same-origin API only).
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    image: potato-disease-frontend:latest
    container_name: potato-disease-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - potato-disease-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  potato-disease-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: potato-disease-backend:latest
    container_name: potato-disease-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
