services:
  potato-disease-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: potato-disease-app:latest
    container_name: potato-disease-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
