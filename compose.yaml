services:
  potato-disease-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: potato-disease-app:latest
    container_name: potato-disease-app
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  potato-disease-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: potato-disease-frontend:latest
    container_name: potato-disease-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - potato-disease-backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  potato-disease-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: potato-disease-backend:latest
    container_name: potato-disease-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
